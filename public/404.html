<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var path = window.location.pathname;
        if (path === '/' || path === '') return;

        sessionStorage.setItem('ghpages-redirect', path + window.location.search + window.location.hash);
        window.location.replace('/');
      })();
    </script>
  </head>
  <body>Redirecting...</body>
</html>
