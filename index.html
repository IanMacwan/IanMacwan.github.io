    <script>
      (function () {
        var redirect = sessionStorage.getItem('ghpages-redirect');
        if (redirect) {
          sessionStorage.removeItem('ghpages-redirect');
          if (redirect !== '/' && redirect !== '') {
            window.history.replaceState(null, null, redirect);
          }
        }
      })();
    </script>
