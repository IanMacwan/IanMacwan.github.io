<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages 404 redirect trick.
      // Encodes the full path into a query string so index.html can restore it.
      var segmentCount = 1; // set to 0 if using a custom domain (username.github.io)
                             // set to 1 if using a project page (username.github.io/repo-name)
      var location = window.location;
      location.replace(
        location.protocol + '//' + location.hostname +
        (location.port ? ':' + location.port : '') +
        location.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
        '/?p=/' +
        location.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (location.search ? '&q=' + location.search.slice(1).replace(/&/g, '~and~') : '') +
        location.hash
      );
    </script>
  </head>
  <body>Redirecting...</body>
</html>
